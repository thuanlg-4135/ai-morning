name: Refresh AI Morning news index once

on:
  push:
    paths:
      - '.github/workflows/refresh-news-index-once.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Refresh news index
        run: npm run news:index

      - name: Commit generated index
        run: |
          if git diff --quiet -- data/news-index.json; then
            echo "news index already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news-index.json
          git commit -m "Refresh AI Morning news index for 2026-08-26"
          git push
