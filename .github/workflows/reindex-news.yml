name: Regenerate AI Morning news index

on:
  push:
    paths:
      - '.github/workflows/reindex-news.yml'

permissions:
  contents: write

jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Regenerate news index
        run: npm run news:index
      - name: Commit generated index
        run: |
          if git diff --quiet -- data/news-index.json; then
            echo "News index already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news-index.json
          git commit -m "chore: refresh AI Morning news index"
          git push
