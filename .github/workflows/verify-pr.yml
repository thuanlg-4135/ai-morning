name: Verify pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Refresh derived news index
        run: npm run news:index
      - name: Build static site
        run: npm run build
      - name: Install browser for UI checks
        run: npx playwright install --with-deps chromium
      - name: Verify exported website
        run: npm run test:browser
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-qa-screenshots
          path: .verification/pages
          if-no-files-found: warn
          retention-days: 7
